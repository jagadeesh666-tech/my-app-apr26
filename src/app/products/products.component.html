<h1>Products</h1>
<div class=" container">
    <div class="left">
        <input type="text" placeholder="search" [(ngModel)]="term">
        <button (click)="search()">search</button>
        <button >Only free delivery</button>
        <button (click)="priceLH()">Price low to high</button>
        <button (click)="priceHL()">Price High to Low</button>
        <button (click)="discount()">Apply 50% Discount</button>
        <button>Price with delivery changes</button>
        <button (click)="totalprices()">Total Price</button>
        <button (click)="totalitems()">Total cart items</button>
    </div>

    <div class="right">
        <label for="">Name:</label>
        <input type="text" [(ngModel)]="productName">
        <br>
        <label for="">Price:</label>
        <input type="number" [(ngModel)]="price">
        <br>
        <label for="">Rating:</label>
        <input type="number" [(ngModel)]="rating"><br>
        <label for="">Free Delivery:</label>
        <input type="radio" name="a">
        <label for="">Yes</label>
        <input type="radio" name="a">
        <label for="">No</label><br>
        <button (click)="create()">Add to cart</button><br></div>

</div>
        <table>
            <thead>
                <tr>
                    <th>S.NO</th>
                    <th>Product Name</th>
                    <th>Price</th>
                    <th>Rating</th>
                    <th>Free-Delivery</th>
                    <th>Actions</th>
                </tr>
            </thead>
            <tbody>
                <tr *ngFor=" let product of products;let i = index ">
                    <td>{{i+1}}</td>
                    <td>{{product.productName}}</td>
                    <td>{{product.price}}</td>
                    <td>
                        <app-rating [rating]="product.rating"></app-rating>
                    </td>
                    <td>{{product.FreeDelivery ? 'Yes' : 'No' }}</td>
                    <td>
                        <button (click)="delete(i)">delete</button>
                    </td>
                </tr>
            </tbody>
        </table>
