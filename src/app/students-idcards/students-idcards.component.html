    <label for="">Order:</label>
    <select name="" id="" [(ngModel)]="order">
        <option value="asc">Asscending</option>
        <option value="desc">Decesnding</option>
    </select>

    <button (click)="sortidcards()">SortByOrder</button>
</div>

<div class="container">


    <div class="id-card" *ngFor="let cards of studentid; let i = index">

        <!-- Header Band -->
        <div class="header">
            <img class="logo" [src]="cards.school_logo" alt="">
            <div class="school-info">
                <h2>{{cards.school_name}}</h2>
                <p>({{cards.school_city}} - {{cards.school_pin}})</p>
            </div>
        </div>

        <!-- Body -->
        <div class="body">

            <!-- Profile -->
            <div class="profile-section">
                <img class="profile-pic" [src]="cards.profile_picture" alt="">
            </div>

            <!-- Details -->
            <div class="details">
                <p><span>Id:</span>{{i+35}}</p>
                <p><span>Name:</span> {{cards.name}}</p>
                <p><span>Phone:</span> {{cards.phone}}</p>
                <p><span>City:</span> {{cards.city}}</p>
                <p><span>DOB:</span> {{cards.dob}}</p>
            </div>

        </div>

        <!-- Footer -->
        <div class="footer">
            <p>{{cards.email}}</p>
        </div>

        <div class="button">
            <button routerLink="/dashboard/student-details/{{cards.id}}">View</button>
            <button routerLink="/dashboard/edit-details/{{cards.id}}">Edit</button>
            <button (click)="deletestudentidcard(cards.id)">Delete</button>
        </div>
    </div>
</div>

<button class="red-button" (click)="pagedcards(i+1)"
    *ngFor="let page of [].constructor(10);let i=index">{{i+1}}</button>
<hr>

<button class="green-button" (click)="pagedcardsparams(i+1)"
    *ngFor="let page of [].constructor(10);let i=index">{{i+1}}</button>
