
<h1>Create Details Of StudentID  CARD Form</h1>
<form action="" [formGroup] ="userform" (ngSubmit)="submit()">
    <label for="">name</label>
    <input type="text" formControlName="name">
    <br>
    <label for="">phone</label>
    <input type="number" formControlName="phone">
    <br>
    <label for="">city</label>
    <input type="text" formControlName="city">
    <br>
    <label for="">dob</label>
    <input type="date" formControlName="dob">
    <br>
    <label for="">profile_picture</label>
    <input type="file"  formControlName="profile_picture">
    <br>
    <label for="">email</label>
    <input type="text" formControlName="email">
    <br>
    <label for="">school_logo</label>
    <input type="file" formControlName="school_logo">
    <br>
     <label for="">school_name</label>
    <input type="text" formControlName="school_name">
    <br>
     <label for="">school_city</label>
    <input type="text" formControlName="school_city">
    <br>
     <label for="">school_pin</label>
    <input type="number" formControlName="school_pin" >
    <br>
    <input type="submit">
</form>
