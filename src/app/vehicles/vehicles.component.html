<p>vehicles works!</p>

<table border="2">
    <thead >
        <tr>
            <th>Vehicle</th>
            <th>manufacturer</th>
            <th>model</th>
            <th>type</th>
            <th>fuel</th>
            <th>color</th>
            <th>image</th>
            <!-- <th>cost</th>
            <th>tyres</th> -->
            <th>id</th>
            <th>Actions</th>
        </tr>
    </thead>
    <tbody>
        <tr *ngFor="let vehicle of vehicles">
            <td>{{vehicle.Vehicle}}</td>
            <td>{{vehicle.manufacturer}}</td>
            <td>{{vehicle.model}}</td>
            <td>{{vehicle.type}}</td>
            <td>{{vehicle.fuel}}</td>
            <td>{{vehicle.color}}</td>
            <td>
                <img [src]="vehicle.image" alt="" width="60px" height="60px">
            </td>
            <!-- <td>{{vehicle.cost}}</td>
            <td>{{vehicle.tyres}}</td> -->
            <td>{{vehicle.id}}</td>
            <td>
                <button class="red-button" (click)="deletevehicle(vehicle.id)">delete</button>
            </td>
        </tr>
    </tbody>
</table>
